<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student CRUD - Sequelize & React (Q8)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #f1f5f9; color: #1e293b; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 28px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
    h1 { color: #0f172a; font-size: 22px; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-warning { background: #f59e0b; }
    .btn-warning:hover { background: #d97706; }
    .search-box { width: 300px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; font-weight: 600; color: #475569; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 550px; max-width: 90%; }
    .badge-score { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [students, setStudents] = useState([]);
      const [search, setSearch] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [error, setError] = useState('');

      const [formData, setFormData] = useState({
        rollNo: '',
        name: '',
        email: '',
        course: '',
        marks: '',
        city: ''
      });

      const fetchStudents = async () => {
        try {
          const res = await fetch(`/api/students?search=${encodeURIComponent(search)}`);
          const data = await res.json();
          setStudents(data);
        } catch (err) {
          console.error(err);
        }
      };

      useEffect(() => {
        fetchStudents();
      }, [search]);

      const handleOpenModal = (student = null) => {
        setError('');
        if (student) {
          setEditingStudent(student);
          setFormData({
            rollNo: student.rollNo,
            name: student.name,
            email: student.email,
            course: student.course,
            marks: student.marks,
            city: student.city
          });
        } else {
          setEditingStudent(null);
          setFormData({ rollNo: '', name: '', email: '', course: '', marks: '', city: '' });
        }
        setShowModal(true);
      };

      const handleCloseModal = () => {
        setShowModal(false);
        setEditingStudent(null);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');

        const url = editingStudent ? `/api/students/${editingStudent.id}` : '/api/students';
        const method = editingStudent ? 'PUT' : 'POST';

        try {
          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const data = await res.json();
          if (res.ok) {
            handleCloseModal();
            fetchStudents();
          } else {
            setError(data.message || 'Error saving student details');
          }
        } catch (err) {
          setError('Network error saving student details');
        }
      };

      const handleDelete = async (id) => {
        if (confirm('Are you sure you want to delete this student record?')) {
          try {
            await fetch(`/api/students/${id}`, { method: 'DELETE' });
            fetchStudents();
          } catch (err) {
            alert('Error deleting student');
          }
        }
      };

      return (
        <div className="container">
          <div className="card">
            <header>
              <div>
                <h1>🎓 Student Collection (Sequelize + Express + React)</h1>
                <p style={{ color: '#64748b', fontSize: '14px', marginTop: '4px' }}>Question 8 Solution</p>
              </div>
              <button className="btn" onClick={() => handleOpenModal()}>+ Add New Student</button>
            </header>

            <div style={{ display: 'flex', justifyBetween: 'space-between', marginBottom: '16px' }}>
              <input 
                type="text" 
                className="search-box" 
                placeholder="🔍 Search by name, roll no, course, city..." 
                value={search}
                onChange={e => setSearch(e.target.value)}
              />
              <span style={{ fontSize: '14px', color: '#64748b', alignSelf: 'center' }}>Total Records: <strong>{students.length}</strong></span>
            </div>

            {students.length === 0 ? (
              <p style={{ textAlignment: 'center', color: '#64748b', padding: '30px 0' }}>No students found.</p>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Roll No</th>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>City</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {students.map(s => (
                    <tr key={s.id}>
                      <td><strong>{s.rollNo}</strong></td>
                      <td>{s.name}</td>
                      <td>{s.email}</td>
                      <td>{s.course}</td>
                      <td><span className="badge-score">{s.marks} / 100</span></td>
                      <td>{s.city}</td>
                      <td>
                        <button className="btn btn-warning" style={{ padding: '6px 12px', fontSize: '12px', marginRight: '6px' }} onClick={() => handleOpenModal(s)}>Edit</button>
                        <button className="btn btn-danger" style={{ padding: '6px 12px', fontSize: '12px' }} onClick={() => handleDelete(s.id)}>Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          <!-- Add / Edit Modal -->
          {showModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h2 style={{ marginBottom: '20px', color: '#0f172a' }}>{editingStudent ? 'Edit Student Details' : 'Add New Student'}</h2>

                {error && <div style={{ background: '#fee2e2', color: '#991b1b', padding: '10px', borderRadius: '6px', marginBottom: '16px', fontSize: '14px' }}>{error}</div>}

                <form onSubmit={handleSubmit}>
                  <div className="form-grid">
                    <div className="form-group">
                      <label>Roll Number</label>
                      <input type="text" value={formData.rollNo} onChange={e => setFormData({ ...formData, rollNo: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>Full Name</label>
                      <input type="text" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>Email Address</label>
                      <input type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>Course</label>
                      <input type="text" value={formData.course} onChange={e => setFormData({ ...formData, course: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>Marks</label>
                      <input type="number" value={formData.marks} onChange={e => setFormData({ ...formData, marks: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>City</label>
                      <input type="text" value={formData.city} onChange={e => setFormData({ ...formData, city: e.target.value })} required />
                    </div>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn" style={{ background: '#64748b' }} onClick={handleCloseModal}>Cancel</button>
                    <button type="submit" className="btn">{editingStudent ? 'Update Record' : 'Save Student'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
